; Firmware build (ESP32-WROOM-32, Arduino framework). Host unit tests use CMake, see README.md.
;
; Platform pinned to 6.12.0 on purpose (decision D2): Arduino-ESP32 core 2.0.17 is what gets
; installed (recorded in docs/dependencies.md). IRremoteESP8266 behaviour with core 3.x is NOT verified.
;
; DISPLAY CONTROLLER: the author's panel was identified with `display_probe` on 2026-10-31 as SSD1306
; (the SSD1306 test picture was clean, the SH1106 one was not; docs/logs/2026-10-31-b2-b3.md), so the default
; environment is esp32dev_ssd1306. A different panel must be re-identified with display_probe first:
;   esp32dev_ssd1306  -> SSD1306 (default, verified on this unit)
;   esp32dev          -> SH1106  (kept for other panels)
;
; Bring-up tools (docs/physical-test-plan.md):
;   display_probe     -> shows a test picture with both OLED drivers
;   bench             -> serial console to test one hardware block at a time (I2C, buttons, IR in/out, ADC)
;
; Do not run `pio pkg install --library ...` here: it rewrites this file and drops the comments.
; Edit lib_deps by hand.

[platformio]
default_envs = esp32dev_ssd1306

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    olikraus/U8g2@2.36.18
    crankyoldgit/IRremoteESP8266@2.9.0
lib_ignore =
    iris_testkit

[env:esp32dev]
build_src_filter = +<*> -<probe/> -<bench/>
build_flags =
    ${env.build_flags}
    -DIRIS_DISPLAY_SH1106

[env:esp32dev_ssd1306]
build_src_filter = +<*> -<probe/> -<bench/>
build_flags =
    ${env.build_flags}
    -DIRIS_DISPLAY_SSD1306

; Standalone sketch that draws the same test picture with both controller drivers.
[env:display_probe]
build_src_filter = -<*> +<probe/>

; Serial bring-up console (no UI, no storage).
[env:bench]
build_src_filter = -<*> +<bench/>
